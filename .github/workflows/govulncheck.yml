---
name: govulncheck
# Covers the Go standard library, which osv-scanner does not see.
# Must run under the toolchain pinned by go.mod, not "stable": govulncheck
# assesses the Go it runs under, so "stable" would report clean on a
# vulnerable pin.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Confirm the toolchain under test
        run: go version

      - name: Run govulncheck
        # Default symbol mode: a finding means this code calls it.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
